<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Abravely Chat</title>
  </head>
  <body>
    <div id="app"></div>
    <script>
      window.chatwootConfig = {
        apiHost: '',
        selectedLocale: 'pt_BR',
        allowedLoginMethods: ['email'],
        signupEnabled: 'false',
        installationName: 'Abravely Chat',
      };
      window.globalConfig = {
        installationName: 'Abravely Chat',
        logo: '/brand-assets/logo.svg',
        logoDark: '/brand-assets/logo_dark.svg',
      };
      window.errorLoggingConfig = null;
    </script>
    <script type="module">
      const publicV3Route =
        /^\/app\/(?:login(?:\/sso)?|auth\/(?:signup|confirmation|verify-email|password\/edit|reset\/password))$/.test(
          window.location.pathname
        ) || window.location.pathname === '/login';

      if (publicV3Route) {
        import('/app/javascript/entrypoints/v3app.js');
      } else {
        import('/app/javascript/entrypoints/dashboard.js');
      }
    </script>
  </body>
</html>
